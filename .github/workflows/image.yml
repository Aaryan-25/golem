# Makes the pendrive image and publishes it under Releases.
# Run from the Actions tab: "Make pendrive image" -> "Run workflow".
name: Make pendrive image
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Allow the build's small virtual machine
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - name: Build the pendrive image
        run: nix build .#image -L --show-trace
      - name: Boot test (start the image in a virtual laptop and wait for the login)
        run: |
          set -euo pipefail
          ovmf=$(nix build --inputs-from . nixpkgs#OVMF.fd --no-link --print-out-paths)/FV/OVMF.fd
          qemu=$(nix build --inputs-from . nixpkgs#qemu_kvm --no-link --print-out-paths)/bin/qemu-system-x86_64
          cp result/nixos.img test.img && chmod +w test.img && truncate -s +2G test.img
          $qemu -enable-kvm -m 2048 -smp 2 -bios "$ovmf" -drive file=test.img,format=raw,if=virtio \
            -display none -serial file:serial.log -no-reboot &
          for i in $(seq 1 120); do
            if grep -q "golem login:" serial.log 2>/dev/null; then echo "BOOTED: reached the login"; break; fi
            sleep 5
          done
          kill %1 || true
          grep -q "golem login:" serial.log || { tail -60 serial.log; echo "::error::Golem did not reach the login"; exit 1; }
          grep -iE "resiz|grow" serial.log | tail -5 || true
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="golem-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          mkdir out
          xz -T0 -6 -c result/nixos.img > out/golem.img.xz
          ls -lh out
          (cd out && sha256sum * > SHA256SUMS.txt)
          gh release create "$tag" out/* --title "Golem $tag" --notes "Flash golem.img.xz onto the pendrive with Rufus, then start the laptop from it (F12). First password: golem"
