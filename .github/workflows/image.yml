# Makes the pendrive image and publishes it under Releases.
# Run from the Actions tab: "Make pendrive image" -> "Run workflow".
name: Make pendrive image
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Allow the build's small virtual machine
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - name: Build the pendrive image
        run: nix build .#image -L --show-trace
      - name: Publish as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="golem-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}"
          mkdir out
          xz -T0 -6 -c result/nixos.img > out/golem.img.xz
          ls -lh out
          (cd out && sha256sum * > SHA256SUMS.txt)
          gh release create "$tag" out/* --title "Golem $tag" --notes "Flash golem.img.xz onto the pendrive with Rufus, then start the laptop from it (F12). First password: golem"
