# Every change is checked by building the whole Golem system.
# Red cross = broken; nothing reaches the laptop until it's green.
name: Check Golem builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Allow the test's virtual laptop
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - name: Build the whole Golem system
        run: nix build .#system -L --show-trace
      - name: Test Golem in a virtual laptop (login, keys, zones, Wi-Fi, clock)
        run: nix build .#checks.x86_64-linux.vm -L -o vm-test
      - name: Size, and the 30 biggest pieces
        run: |
          nix path-info -Sh ./result
          nix path-info -rs ./result | sort -k2 -n | tail -40 | awk "{printf \"%6d MB  %s\\n\", \$2/1048576, \$1}"
